<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동등 분할 룰렛 (The Equal Wheel)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        #roulette-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto 30px;
        }

        #roulette-wheel {
            position: relative;
        }

        #needle {
            position: absolute;
            z-index: 10;
        }

        #go-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        #go-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        #go-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #result {
            margin-top: 20px;
            font-size: 1.3em;
            color: #333;
            min-height: 30px;
            font-weight: bold;
        }

        #error {
            margin-top: 20px;
            color: #e74c3c;
            font-size: 1em;
            min-height: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            #roulette-container {
                width: 300px;
                height: 300px;
            }

            #go-button {
                padding: 12px 40px;
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 동등 분할 룰렛 🎰</h1>
        <div id="roulette-container"></div>
        <button id="go-button">GO!</button>
        <div id="result"></div>
        <div id="error"></div>
    </div>

    <script>
        // 상품 설정
        const PRIZES = [
            {
                name: "팝콘",
                grade: "C",
                startAngle: 0,
                endAngle: 72,
                centerAngle: 36,
                color: "#FFE66D",
                emoji: "🍿"
            },
            {
                name: "핫도그",
                grade: "B",
                startAngle: 72,
                endAngle: 144,
                centerAngle: 108,
                color: "#FF6B6B",
                emoji: "🌭"
            },
            {
                name: "콤보",
                grade: "B",
                startAngle: 144,
                endAngle: 216,
                centerAngle: 180,
                color: "#4ECDC4",
                emoji: "🍔"
            },
            {
                name: "오징어",
                grade: "A",
                startAngle: 216,
                endAngle: 288,
                centerAngle: 252,
                color: "#95E1D3",
                emoji: "🦑"
            },
            {
                name: "치킨",
                grade: "S",
                startAngle: 288,
                endAngle: 360,
                centerAngle: 324,
                color: "#FFA07A",
                emoji: "🍗"
            }
        ];

        // API 엔드포인트
        const API_ENDPOINT = 'http://localhost:5000/api/spin';
        const TIMEOUT_MS = 10000;

        // RouletteDisplay 클래스
        class RouletteDisplay {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                this.render();
            }

            render() {
                // 룰렛 휠 SVG
                const wheelSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                wheelSvg.setAttribute("width", "100%");
                wheelSvg.setAttribute("height", "100%");
                wheelSvg.setAttribute("viewBox", "0 0 400 400");
                wheelSvg.id = "roulette-wheel";

                // 룰렛 섹션 그리기
                PRIZES.forEach(prize => {
                    const path = this.createSectorPath(200, 200, 180, prize.startAngle, prize.endAngle);
                    const sector = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    sector.setAttribute("d", path);
                    sector.setAttribute("fill", prize.color);
                    sector.setAttribute("stroke", "#fff");
                    sector.setAttribute("stroke-width", "3");
                    wheelSvg.appendChild(sector);

                    // 상품 이모지 추가
                    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    const angle = (prize.startAngle + prize.endAngle) / 2;
                    const radian = (angle - 90) * Math.PI / 180;
                    const radius = 120;
                    const x = 200 + radius * Math.cos(radian);
                    const y = 200 + radius * Math.sin(radian);
                    
                    text.setAttribute("x", x);
                    text.setAttribute("y", y);
                    text.setAttribute("text-anchor", "middle");
                    text.setAttribute("dominant-baseline", "middle");
                    text.setAttribute("font-size", "40");
                    text.textContent = prize.emoji;
                    wheelSvg.appendChild(text);
                });

                // 중앙 원
                const center = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                center.setAttribute("cx", "200");
                center.setAttribute("cy", "200");
                center.setAttribute("r", "30");
                center.setAttribute("fill", "#fff");
                center.setAttribute("stroke", "#333");
                center.setAttribute("stroke-width", "3");
                wheelSvg.appendChild(center);

                this.container.appendChild(wheelSvg);

                // 회전 바늘 (별도 SVG로 위쪽 고정)
                const needleSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                needleSvg.setAttribute("width", "100%");
                needleSvg.setAttribute("height", "100%");
                needleSvg.setAttribute("viewBox", "0 0 400 400");
                needleSvg.setAttribute("style", "position: absolute; top: 0; left: 0; pointer-events: none;");
                needleSvg.id = "needle-container";

                const needle = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                needle.setAttribute("points", "200,60 190,20 210,20");
                needle.setAttribute("fill", "#e74c3c");
                needle.setAttribute("stroke", "#c0392b");
                needle.setAttribute("stroke-width", "2");
                needle.id = "needle";
                needleSvg.appendChild(needle);

                this.container.appendChild(needleSvg);
            }

            createSectorPath(cx, cy, r, startAngle, endAngle) {
                const start = this.polarToCartesian(cx, cy, r, endAngle);
                const end = this.polarToCartesian(cx, cy, r, startAngle);
                const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
                
                return [
                    "M", cx, cy,
                    "L", start.x, start.y,
                    "A", r, r, 0, largeArcFlag, 0, end.x, end.y,
                    "Z"
                ].join(" ");
            }

            polarToCartesian(cx, cy, r, angle) {
                const radian = (angle - 90) * Math.PI / 180;
                return {
                    x: cx + r * Math.cos(radian),
                    y: cy + r * Math.sin(radian)
                };
            }

            getPrizePositions() {
                return PRIZES.map(p => ({
                    name: p.name,
                    centerAngle: p.centerAngle
                }));
            }
        }

        // AnimationEngine 클래스
        class AnimationEngine {
            constructor(rouletteElement) {
                this.roulette = rouletteElement;
                this.currentRotation = 0;
            }

            calculateTotalRotation(targetAngle, randomOffset) {
                // 바늘이 위쪽(0도)을 가리키므로, 상품이 위쪽에 오도록 회전
                // 360도에서 targetAngle을 빼서 반시계 방향으로 회전
                const adjustedAngle = 360 - targetAngle;
                // N-1바퀴는 정확히 돌고, 마지막 바퀴에서 해당 상품 섹션 내 랜덤 위치에 멈춤
                return (360 * 4) + adjustedAngle + randomOffset;
            }

            async spin(targetAngle) {
                // 매번 0도에서 시작하도록 초기화
                this.reset();
                
                // 약간의 지연 후 회전 시작 (reset이 적용되도록)
                await new Promise(resolve => setTimeout(resolve, 50));

                // 각 상품 섹션은 72도(360/5)이므로, 해당 섹션 내에서 랜덤 위치 선택
                // 중심에서 ±30도 범위 내에서 랜덤 (섹션을 벗어나지 않도록)
                const randomOffset = (Math.random() * 60) - 30; // -30 ~ +30도
                const totalRotation = this.calculateTotalRotation(targetAngle, randomOffset);
                const duration = 3000 + Math.random() * 2000; // 3-5초

                this.roulette.style.transition = `transform ${duration}ms cubic-bezier(0.17, 0.67, 0.12, 0.99)`;
                this.roulette.style.transform = `rotate(${totalRotation}deg)`;

                return new Promise(resolve => {
                    setTimeout(() => {
                        this.currentRotation = totalRotation % 360;
                        resolve();
                    }, duration);
                });
            }

            reset() {
                this.roulette.style.transition = 'none';
                this.roulette.style.transform = 'rotate(0deg)';
                this.currentRotation = 0;
            }
        }

        // UIController 클래스
        class UIController {
            constructor(apiEndpoint) {
                this.apiEndpoint = apiEndpoint;
                this.isSpinning = false;
                this.button = document.getElementById('go-button');
                this.resultDiv = document.getElementById('result');
                this.errorDiv = document.getElementById('error');
            }

            async handleSpinClick() {
                if (this.isSpinning) return;

                this.isSpinning = true;
                this.button.disabled = true;
                this.resultDiv.textContent = '';
                this.errorDiv.textContent = '';

                try {
                    const response = await this.callSpinAPI();
                    
                    if (!response.prize || response.target_angle === undefined) {
                        throw new Error('잘못된 응답 형식입니다.');
                    }

                    await animationEngine.spin(response.target_angle);
                    this.displayResult(response.prize);

                } catch (error) {
                    this.displayError(error.message);
                    console.error('Spin error:', error);
                } finally {
                    this.isSpinning = false;
                    this.button.disabled = false;
                }
            }

            async callSpinAPI() {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

                try {
                    const response = await fetch(this.apiEndpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);

                    if (!response.ok) {
                        throw new Error(`서버 오류: ${response.status}`);
                    }

                    return await response.json();

                } catch (error) {
                    clearTimeout(timeoutId);
                    
                    if (error.name === 'AbortError') {
                        throw new Error('요청 시간이 초과되었습니다. 다시 시도해주세요.');
                    }
                    
                    if (error.message.includes('Failed to fetch')) {
                        throw new Error('서버에 연결할 수 없습니다. 네트워크 연결을 확인해주세요.');
                    }
                    
                    throw error;
                }
            }

            displayResult(prize) {
                this.resultDiv.textContent = `🎉 당첨: ${prize}!`;
                this.resultDiv.style.opacity = '0';
                setTimeout(() => {
                    this.resultDiv.style.transition = 'opacity 0.5s ease';
                    this.resultDiv.style.opacity = '1';
                }, 100);
            }

            displayError(message) {
                this.errorDiv.textContent = `❌ ${message}`;
            }
        }

        // 초기화
        const rouletteDisplay = new RouletteDisplay('roulette-container');
        const rouletteWheel = document.getElementById('roulette-wheel');
        const animationEngine = new AnimationEngine(rouletteWheel);
        const uiController = new UIController(API_ENDPOINT);

        // 이벤트 리스너
        document.getElementById('go-button').addEventListener('click', () => {
            uiController.handleSpinClick();
        });
    </script>
</body>
</html>
